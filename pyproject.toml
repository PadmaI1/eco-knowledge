[project]
name = "ecoknowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Padma Iyer", email = "padmaiyer01@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=3.4.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-text-splitters>=1.1.3",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
ecoknowledge = "ecoknowledge:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
